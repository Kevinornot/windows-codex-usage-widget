[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-widget"
version = "1.1.0"
description = "A Chinese white-glass desktop widget for Codex sessions, tokens, context, quotas, and system resources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex Usage Widget contributors" }]
dependencies = []

[project.scripts]
codex-usage-widget = "codex_usage_widget.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
